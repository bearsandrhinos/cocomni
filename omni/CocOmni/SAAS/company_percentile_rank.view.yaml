    sql: '"ACCOUNT_ID"'
    format: ID

  snapshot_month:
    sql: '"SNAPSHOT_MONTH"'

  metric_id:
    sql: '"METRIC_ID"'
    format: ID

  peer_group_segment:
    sql: '"PEER_GROUP_SEGMENT"'

  peer_group_region:
    sql: '"PEER_GROUP_REGION"'

  peer_group_product_tier:
    sql: '"PEER_GROUP_PRODUCT_TIER"'

  percentile_rank:
    sql: '"PERCENTILE_RANK"'

measures:
  count:
    aggregate_type: count
