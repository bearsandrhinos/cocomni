# Reference this view as saas__fact_company_usage_metrics
schema: SAAS
table_name: FACT_COMPANY_USAGE_METRICS

dimensions:
  account_id:
    sql: '"ACCOUNT_ID"'
    format: ID

  snapshot_month:
    sql: '"SNAPSHOT_MONTH"'

  segment:
    sql: '"SEGMENT"'

  region:
    sql: '"REGION"'

  product_tier:
    sql: '"PRODUCT_TIER"'

  metric_id:
    sql: '"METRIC_ID"'
    format: ID

  value:
    sql: '"VALUE"'

measures:
  count:
    aggregate_type: count
