ai_context: "This view contains per-team, per-match statistics for FIFA World
  Cup matches. Use it to analyze team performance including win/loss records,
  goal-scoring patterns across match periods, shooting, passing, discipline, and
  head-to-head matchups. The 'is_won' dimension indicates whether the team won
  the match (goals_scored > goals_conceded). Goals are broken down by period: HT
  (half-time/first half), FT (full-time/second half), ET (extra time), and PEN
  (penalties). Each fixture appears twice — once for each team. Use round to
  analyze knockout vs group stage performance."
