  game_sub_label:
    sql: '"GAME_SUB_LABEL"'

  series_text:
    sql: '"SERIES_TEXT"'

  series_game_number:
    sql: '"SERIES_GAME_NUMBER"'

  arena_name:
    sql: '"ARENA_NAME"'

  arena_city:
    sql: '"ARENA_CITY"'

  arena_state:
