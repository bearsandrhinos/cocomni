  away_team_abbreviation:
    sql: '"AWAY_TEAM_ABBREVIATION"'

  away_wins:
    sql: '"AWAY_WINS"'

  away_losses:
    sql: '"AWAY_LOSSES"'

  away_score:
    sql: '"AWAY_SCORE"'

  national_broadcaster:
